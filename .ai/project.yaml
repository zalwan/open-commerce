# AI-Native Repository Standard v1.0 — Project Metadata

standard:
  name: "AI-Native Repository Standard"
  version: "1.0"

project:
  name: "Open Commerce"
  description: "Open source single-vendor e-commerce: katalog, cart, checkout (stub), admin — backend Go + frontend SvelteKit."
  status: "active"
  maturity: "prototype"
  owners: ["community-maintainer"]

technology:
  languages: ["Go 1.25", "TypeScript 5.x (Svelte 4)"]
  frameworks: ["Go stdlib net/http", "pgx v5 (pgpool)", "SvelteKit 2", "Vite 5"]
  runtimes: ["Go 1.25", "Node.js 22 LTS"]
  databases: ["Postgres 16 (active when DATABASE_URL set)", "local disk DATA_DIR (product images)", "in-memory maps (fallback when DATABASE_URL empty)"]
  infrastructure: ["Docker Compose (api, web, db)", "Terraform/OpenTofu scaffold for GCP (planned, not applied)"]
  cicd: ["GitHub Actions (go test + integration, npm build)"]
  observability: ["stdout slog logs", "/healthz liveness", "/readyz readiness"]
  external_services: []

architecture:
  style: "modular-monolith (backend) + client-server (frontend to API)"
  patterns: ["handler-service-store", "interface-stub (payment/auth)", "file-based-routing (SvelteKit)", "versioned-REST /api/v1"]

documentation:
  system: "docs/system"
  decisions: "docs/decisions"
  operations: "docs/operations"
  development: "docs/development"

ai:
  instructions: ".ai"
  root_agent_file: "AGENTS.md"
  checklists:
    - ".ai/checklists/feature.md"
    - ".ai/checklists/bugfix.md"
    - ".ai/checklists/refactor.md"
    - ".ai/checklists/infrastructure.md"
