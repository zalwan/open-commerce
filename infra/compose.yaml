# Services for local development (v0.2: Postgres is the active store when api runs via compose).
# Usage: docker compose -f infra/compose.yaml up db  (then run api/web locally from source)
# Full images: docker compose -f infra/compose.yaml up --build
# NOTE: build contexts are repo-root so Dockerfiles can COPY app/... paths.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opencommerce
      POSTGRES_PASSWORD: opencommerce
      POSTGRES_DB: opencommerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opencommerce"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://opencommerce:opencommerce@db:5432/opencommerce?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    # No in-image healthcheck: the distroless runtime ships no shell/wget.
    # Probe from host instead: curl localhost:8080/healthz (liveness),
    # curl localhost:8080/readyz (DB readiness).
    healthcheck:
      disable: true

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
