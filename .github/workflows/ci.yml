name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (go vet + test + integration + build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opencommerce
          POSTGRES_PASSWORD: opencommerce
          POSTGRES_DB: opencommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencommerce"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://opencommerce:opencommerce@localhost:5432/opencommerce?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - working-directory: app/backend
        run: |
          go vet ./...
          go test ./...
          go test -tags integration ./...
          go build ./...

  frontend:
    name: frontend (npm check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - working-directory: app/frontend
        run: |
          npm ci || npm install --no-audit --no-fund
          npm run check
          npm run build
